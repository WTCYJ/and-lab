    - title: 청소년 IT 학술대회 및 대학생 IT 논문 경진대회 심사위원
      org: 한국정보기술진흥원
    - title: 한국 인공지능 올림피아드(KOAI) STAFF
      org: 한국정보기술진흥원
  areas: [app, reversing, kernel, fuzzing]
  bio: 웹·모바일 취약점 분석, CTF, 버그바운티, 보안 도구 개발을 합니다. AND-LAB에서는 안드로이드 해킹 기초와 모의해킹 교육, 프로젝트 피드백을 맡고 있습니다.
  github: WTCYJ
  blog: https://wtcyj.github.io/
  email: ""
  portfolio:
