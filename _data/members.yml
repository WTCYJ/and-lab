# 팀원. key 는 글 front matter 의 author 값과 맞춘다. 적힌 순서대로 팀원 페이지에 나온다.
#
#   name        이름
#   handle      활동명(아바타 이니셜과 @표시에 쓰인다)
#   role        역할. lead: true 면 초록 배지로 강조
#   affiliations 소속·활동 목록
#   career      (선택) 경력. status 에 현 / 전 을 적으면 앞에 붙는다
#   areas       연구 분야. _config.yml 의 topics 키(app, reversing, platform, fuzzing, kernel, hardware)
#   bio         두세 문장 소개
#   photo       (선택) 프로필 사진 경로. 예: /assets/img/team/seika.jpg — 없으면 이니셜로 표시
#   github / blog / email  (선택) 비워 두면 표시하지 않음
#   portfolio   (선택) 대표 글 목록. group 으로 묶여 보인다
#
# 새 팀원은 아래 형식으로 이어서 적는다.
#
# - key: newbie
#   name: 이름
#   handle: handle
#   role: 연구원
#   affiliations: []
#   areas: [reversing]
#   bio: 한두 문장 소개
#   github: ""
#   blog: ""
#   email: ""

