{%- comment -%}
패턴락 "A" 심볼. include.id 는 페이지 안에서 겹치지 않게(마스크 id), include.class 로 크기·애니메이션 지정.
색은 CSS 변수(--mark, --mark-dim)를 따라가므로 라이트/다크 둘 다 맞는다.
{%- endcomment -%}
<svg class="mark {{ include.class }}" viewBox="0 0 160 160" aria-hidden="true" focusable="false">
  <mask id="mk-{{ include.id }}" maskUnits="userSpaceOnUse" x="0" y="0" width="160" height="160">
    <rect width="160" height="160" fill="#fff"/>
    <circle cx="80" cy="20" r="8.5"/><circle cx="140" cy="140" r="8.5"/><circle cx="140" cy="80" r="8.5"/><circle cx="80" cy="80" r="8.5"/><circle cx="20" cy="80" r="8.5"/>
  </mask>
  <g class="mark-dim"><circle cx="140" cy="20" r="6"/><circle cx="20" cy="20" r="6"/><circle cx="80" cy="140" r="6"/></g>
  <polyline class="mark-line" pathLength="1" points="20,140 80,20 140,140 140,80 80,80 20,80" mask="url(#mk-{{ include.id }})"/>
  <circle class="mark-start" cx="20" cy="140" r="15"/>
  <g class="mark-rings">
    <circle style="--t:.30" cx="80" cy="20" r="11"/><circle style="--t:.60" cx="140" cy="140" r="11"/><circle style="--t:.73" cx="140" cy="80" r="11"/><circle style="--t:.87" cx="80" cy="80" r="11"/><circle style="--t:1" cx="20" cy="80" r="11"/>
  </g>
</svg>
